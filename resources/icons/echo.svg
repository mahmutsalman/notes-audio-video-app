<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Echo companion app icon. Same microphone mark as icon.svg so it reads as the same
       family in the Dock, tinted violet — the colour ReviewSession already uses for its
       audio players (ThemedAudioPlayer theme='violet'). -->

  <!-- Deep violet background -->
  <rect width="1024" height="1024" fill="#1c1030"/>

  <!-- Microphone group - centered and scaled -->
  <g transform="translate(512, 480)">
    <defs>
      <!-- Gradient for depth -->
      <linearGradient id="micGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#c4b5fd"/>
        <stop offset="50%" style="stop-color:#f5f3ff"/>
        <stop offset="100%" style="stop-color:#a78bfa"/>
      </linearGradient>

      <!-- Grill pattern gradient -->
      <linearGradient id="grillGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#8b5cf6"/>
        <stop offset="50%" style="stop-color:#ddd6fe"/>
        <stop offset="100%" style="stop-color:#7c3aed"/>
      </linearGradient>
    </defs>

    <!-- Outer microphone body -->
    <rect x="-120" y="-280" width="240" height="340" rx="120" ry="120" fill="url(#micGradient)"/>

    <!-- Inner grill area -->
    <rect x="-100" y="-260" width="200" height="280" rx="100" ry="100" fill="#1c1030" opacity="0.9"/>

    <!-- Grill lines (horizontal) -->
    <g stroke="url(#grillGradient)" stroke-width="4" stroke-linecap="round">
      <line x1="-70" y1="-220" x2="70" y2="-220"/>
      <line x1="-80" y1="-185" x2="80" y2="-185"/>
      <line x1="-85" y1="-150" x2="85" y2="-150"/>
      <line x1="-85" y1="-115" x2="85" y2="-115"/>
      <line x1="-85" y1="-80" x2="85" y2="-80"/>
      <line x1="-85" y1="-45" x2="85" y2="-45"/>
      <line x1="-80" y1="-10" x2="80" y2="-10"/>
      <line x1="-70" y1="25" x2="70" y2="25"/>
    </g>

    <!-- Mount ring -->
    <ellipse cx="0" cy="80" rx="90" ry="20" fill="#8b5cf6"/>
    <ellipse cx="0" cy="75" rx="90" ry="20" fill="url(#micGradient)"/>

    <!-- Stand connector -->
    <rect x="-25" y="90" width="50" height="60" fill="url(#micGradient)"/>

    <!-- Stand pole -->
    <rect x="-12" y="150" width="24" height="120" fill="#a78bfa"/>

    <!-- Base -->
    <ellipse cx="0" cy="280" rx="100" ry="25" fill="#7c3aed"/>
    <ellipse cx="0" cy="270" rx="100" ry="25" fill="url(#micGradient)"/>
  </g>
</svg>
