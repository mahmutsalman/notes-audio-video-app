<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Status</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 500px;
      height: 500px;
      overflow: hidden;
      user-select: none;
      font-family: system-ui, -apple-system, 'SF Pro Display', sans-serif;
      -webkit-app-region: drag;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: background-color 0.35s ease;
    }

    /* State backgrounds */
    #root.state-disconnected { background: #374151; }
    #root.state-stopped      { background: #1f2937; }
    #root.state-recording    { background: #b91c1c; }
    #root.state-paused       { background: #b45309; }

    .dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      flex-shrink: 0;
    }

    .dot.pulse {
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.85); }
    }

    .state-label {
      font-size: 72px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
    }

    .timer {
      font-size: 48px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.75);
      font-family: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
      letter-spacing: 0.06em;
      min-height: 58px;
    }

    .timer.hidden { opacity: 0; }

    .sub-label {
      font-size: 20px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Close button in corner */
    .close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 28px;
      height: 28px;
      border: none;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.5);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      -webkit-app-region: no-drag;
    }

    .close-btn:hover {
      background: rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.9);
    }

    /* ── Control Panel ───────────────────────────────────────────────────────── */
    #ctrl-panel {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      padding: 10px 18px 12px;
      background: rgba(0, 0, 0, 0.25);
      -webkit-app-region: no-drag;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 2px;
    }

    .mark-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mark-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.55);
      width: 32px;
      flex-shrink: 0;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      transition: background 0.2s, border-color 0.2s;
    }

    .color-dot.color-red   { background: #ef4444; border-color: #ef4444; }
    .color-dot.color-amber { background: #f59e0b; border-color: #f59e0b; }
    .color-dot.color-sky   { background: #0ea5e9; border-color: #0ea5e9; }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.85);
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .ctrl-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.22);
    }

    .ctrl-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .ctrl-btn.success {
      background: rgba(34, 197, 94, 0.3);
      border-color: rgba(34, 197, 94, 0.5);
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 2px 0;
    }

    #ocr-text {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      padding: 5px 7px;
      max-height: 48px;
      overflow-y: auto;
      word-break: break-word;
      line-height: 1.4;
    }

    #ocr-assign-row {
      display: none;
      gap: 6px;
    }

    .ocr-fetch-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #ocr-status {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      flex: 1;
    }
  </style>
</head>
<body>
  <div id="root" class="state-disconnected">
    <div class="dot" id="dot"></div>
    <div class="state-label" id="state-label">IDLE</div>
    <div class="timer" id="timer">00:00:00</div>
    <div class="sub-label" id="sub-label">OBS Disconnected</div>

    <!-- ── Ghost Mark Controls ─────────────────────────────────────────────── -->
    <div id="ctrl-panel">
      <div class="section-label">Ghost Marks</div>

      <div class="mark-row">
        <span class="mark-label">CURRENT</span>
        <span id="prev-color-dot" class="color-dot"></span>
        <button id="btn-color-prev" class="ctrl-btn" disabled>Color ◁</button>
        <button id="btn-create-prev" class="ctrl-btn" disabled>+ Mark</button>
        <span id="prev-caption" style="font-size:10px;color:rgba(255,255,255,0.4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0"></span>
      </div>

      <div class="mark-row">
        <span class="mark-label">NEXT</span>
        <span id="next-color-dot" class="color-dot"></span>
        <button id="btn-color-next" class="ctrl-btn" disabled>Color ▷</button>
        <button id="btn-create-next" class="ctrl-btn" disabled>+ Mark</button>
        <span id="next-caption" style="font-size:10px;color:rgba(255,255,255,0.4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0"></span>
      </div>

      <div class="divider"></div>

      <div class="section-label">Clipboard OCR</div>

      <div class="ocr-fetch-row">
        <button id="btn-fetch-ocr" class="ctrl-btn">📋 Fetch Clipboard</button>
        <span id="ocr-status"></span>
      </div>

      <div id="ocr-text" style="display:none"></div>

      <div id="ocr-assign-row">
        <button id="btn-assign-ocr-prev" class="ctrl-btn" disabled>→ Current</button>
        <button id="btn-assign-ocr-next" class="ctrl-btn" disabled>→ Next</button>
      </div>
    </div>

    <button class="close-btn" id="close-btn" title="Hide (F8)">✕</button>
  </div>

  <script>
    const root       = document.getElementById('root');
    const dot        = document.getElementById('dot');
    const stateLabel = document.getElementById('state-label');
    const timerEl    = document.getElementById('timer');
    const subLabel   = document.getElementById('sub-label');
    const closeBtn   = document.getElementById('close-btn');
    const ctrlPanel  = document.getElementById('ctrl-panel');

    // Ghost mark control elements
    const prevColorDot      = document.getElementById('prev-color-dot');
    const nextColorDot      = document.getElementById('next-color-dot');
    const btnColorPrev      = document.getElementById('btn-color-prev');
    const btnColorNext      = document.getElementById('btn-color-next');
    const btnCreatePrev     = document.getElementById('btn-create-prev');
    const btnCreateNext     = document.getElementById('btn-create-next');
    const prevCaptionEl     = document.getElementById('prev-caption');
    const nextCaptionEl     = document.getElementById('next-caption');

    // OCR elements
    const btnFetchOcr       = document.getElementById('btn-fetch-ocr');
    const ocrTextEl         = document.getElementById('ocr-text');
    const ocrAssignRow      = document.getElementById('ocr-assign-row');
    const btnAssignOcrPrev  = document.getElementById('btn-assign-ocr-prev');
    const btnAssignOcrNext  = document.getElementById('btn-assign-ocr-next');
    const ocrStatus         = document.getElementById('ocr-status');

    // ── Timer logic ─────────────────────────────────────────────────────────
    let timerBase    = 0;   // seconds accumulated before latest resume
    let timerStartAt = null; // Date.now() when last resume happened
    let timerInterval = null;

    function startTimer(baseSecs) {
      timerBase    = baseSecs ?? 0;
      timerStartAt = Date.now();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(tick, 200);
      tick();
    }

    function pauseTimer(atSecs) {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      if (atSecs != null) timerBase = atSecs;
      timerStartAt = null;
      tick();
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      timerBase    = 0;
      timerStartAt = null;
    }

    function getCurrentSecs() {
      if (timerStartAt != null) {
        return timerBase + (Date.now() - timerStartAt) / 1000;
      }
      return timerBase;
    }

    function tick() {
      timerEl.textContent = fmtTime(getCurrentSecs());
    }

    function fmtTime(secs) {
      const s = Math.floor(secs);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      return String(h).padStart(2, '0') + ':' +
             String(m).padStart(2, '0') + ':' +
             String(sec).padStart(2, '0');
    }

    // Parse "HH:MM:SS.mmm" timecode string → seconds
    function parseTimecode(tc) {
      if (!tc || tc === '00:00:00') return 0;
      const parts = tc.split(':');
      if (parts.length !== 3) return 0;
      return parseInt(parts[0], 10) * 3600 +
             parseInt(parts[1], 10) * 60 +
             parseFloat(parts[2]);
    }

    // ── Ghost Mark State ────────────────────────────────────────────────────
    let currentGhostMark = null;
    let nextGhostMark = null;
    let ocrText = '';

    // Color cycle: null → red → amber → sky → null
    const COLOR_CYCLE = [null, 'red', 'amber', 'sky'];

    function nextColor(current) {
      const idx = COLOR_CYCLE.indexOf(current);
      return COLOR_CYCLE[(idx + 1) % COLOR_CYCLE.length];
    }

    function applyColorDot(dotEl, color) {
      dotEl.className = 'color-dot' + (color ? ' color-' + color : '');
    }

    function renderGhostMarks() {
      // Current row
      const hasCurrent = !!currentGhostMark;
      applyColorDot(prevColorDot, hasCurrent ? currentGhostMark.color : null);
      btnColorPrev.disabled  = !hasCurrent;
      btnCreatePrev.disabled = !hasCurrent;
      btnAssignOcrPrev.disabled = !hasCurrent || !ocrText;
      prevCaptionEl.textContent = hasCurrent && currentGhostMark.caption ? currentGhostMark.caption : '';

      // Next row
      const hasNext = !!nextGhostMark;
      applyColorDot(nextColorDot, hasNext ? nextGhostMark.color : null);
      btnColorNext.disabled  = !hasNext;
      btnCreateNext.disabled = !hasNext;
      btnAssignOcrNext.disabled = !hasNext || !ocrText;
      nextCaptionEl.textContent = hasNext && nextGhostMark.caption ? nextGhostMark.caption : '';
    }

    async function refreshGhostMarks() {
      if (!window.electronAPI || !window.electronAPI.obs) return;
      try {
        const { current, next } = await window.electronAPI.obs.getRelativeGhostMarks();
        currentGhostMark = current;
        nextGhostMark = next;
        renderGhostMarks();
      } catch (e) {
        console.error('refreshGhostMarks failed', e);
      }
    }

    async function cycleColor(which) {
      const mark = which === 'prev' ? currentGhostMark : nextGhostMark;
      if (!mark) return;
      const newColor = nextColor(mark.color);
      try {
        await window.electronAPI.obs.updateGhostMarkColor(mark.id, newColor);
        mark.color = newColor;
        renderGhostMarks();
      } catch (e) {
        console.error('cycleColor failed', e);
      }
    }

    async function createMarkFromGhost(which) {
      const mark = which === 'prev' ? currentGhostMark : nextGhostMark;
      if (!mark) return;
      const btn = which === 'prev' ? btnCreatePrev : btnCreateNext;
      try {
        await window.electronAPI.obs.createStagedMarkFromGhost(mark.id);
        // Brief visual feedback
        btn.classList.add('success');
        btn.textContent = '✓ Created';
        setTimeout(() => {
          btn.classList.remove('success');
          btn.textContent = '+ Mark';
        }, 1500);
      } catch (e) {
        console.error('createMarkFromGhost failed', e);
      }
    }

    async function fetchClipboardOCR() {
      if (!window.electronAPI || !window.electronAPI.ocr) return;
      ocrStatus.textContent = 'Reading…';
      btnFetchOcr.disabled = true;
      ocrTextEl.style.display = 'none';
      ocrAssignRow.style.display = 'none';
      ocrText = '';

      try {
        const result = await window.electronAPI.ocr.recognizeClipboard();
        if (!result.success || !result.text) {
          ocrStatus.textContent = 'No image or no text found';
          setTimeout(() => { ocrStatus.textContent = ''; }, 2500);
        } else {
          ocrText = result.text;
          ocrTextEl.textContent = ocrText;
          ocrTextEl.style.display = 'block';
          ocrAssignRow.style.display = 'flex';
          ocrStatus.textContent = '';
          renderGhostMarks(); // re-enable assign buttons
        }
      } catch (e) {
        ocrStatus.textContent = 'OCR failed';
        console.error('fetchClipboardOCR failed', e);
        setTimeout(() => { ocrStatus.textContent = ''; }, 2500);
      } finally {
        btnFetchOcr.disabled = false;
      }
    }

    async function assignOcrTo(which) {
      const mark = which === 'prev' ? currentGhostMark : nextGhostMark;
      if (!mark || !ocrText) return;
      const btn = which === 'prev' ? btnAssignOcrPrev : btnAssignOcrNext;
      try {
        await window.electronAPI.obs.updateGhostMarkCaption(mark.id, ocrText);
        mark.caption = ocrText;
        renderGhostMarks();
        btn.classList.add('success');
        const origText = btn.textContent;
        btn.textContent = '✓';
        setTimeout(() => {
          btn.classList.remove('success');
          btn.textContent = origText;
        }, 1200);
      } catch (e) {
        console.error('assignOcrTo failed', e);
      }
    }

    // ── State rendering ─────────────────────────────────────────────────────
    function updateCtrlPanelVisibility(state) {
      const active = state === 'recording' || state === 'paused';
      ctrlPanel.style.display = active ? 'flex' : 'none';
      if (active) refreshGhostMarks();
    }

    function setState(state) {
      // state: 'disconnected' | 'stopped' | 'recording' | 'paused'
      root.className = 'state-' + state;

      dot.classList.remove('pulse');
      timerEl.classList.remove('hidden');

      switch (state) {
        case 'disconnected':
          stateLabel.textContent = 'IDLE';
          subLabel.textContent   = 'OBS Disconnected';
          timerEl.classList.add('hidden');
          stopTimer();
          break;

        case 'stopped':
          stateLabel.textContent = 'IDLE';
          subLabel.textContent   = 'OBS Connected';
          timerEl.classList.add('hidden');
          stopTimer();
          break;

        case 'recording':
          stateLabel.textContent = 'REC';
          subLabel.textContent   = 'Recording';
          dot.classList.add('pulse');
          break;

        case 'paused':
          stateLabel.textContent = 'PAUSE';
          subLabel.textContent   = 'Paused';
          break;
      }

      updateCtrlPanelVisibility(state);
    }

    // ── Apply OBSStatus object ───────────────────────────────────────────────
    function applyStatus(status) {
      if (!status.isConnected) {
        setState('disconnected');
        return;
      }
      if (!status.isRecording) {
        setState('stopped');
        return;
      }
      if (status.isPaused) {
        const pausedSecs = parseTimecode(status.recordTimecode);
        setState('paused');
        pauseTimer(pausedSecs);
        return;
      }
      // Actively recording — start timer from the current reported timecode.
      const baseSecs = parseTimecode(status.recordTimecode);
      setState('recording');
      startTimer(baseSecs);
    }

    // ── IPC events ───────────────────────────────────────────────────────────
    if (window.electronAPI && window.electronAPI.obs) {
      // Initial status fetch
      window.electronAPI.obs.getStatus().then(status => {
        applyStatus(status);
      }).catch(() => {
        setState('disconnected');
      });

      // Status change (connection, recording state changes)
      window.electronAPI.obs.onStatusChange(status => {
        applyStatus(status);
      });

      // Recording started — new session, clear ghost mark state
      window.electronAPI.obs.onStarted(() => {
        currentGhostMark = null;
        nextGhostMark = null;
        ocrText = '';
        ocrTextEl.style.display = 'none';
        ocrAssignRow.style.display = 'none';
        ocrStatus.textContent = '';
        setState('recording');
        startTimer(0);
      });

      // Recording paused — data.timecode in seconds
      window.electronAPI.obs.onPaused(data => {
        setState('paused');
        pauseTimer(data.timecode ?? data.timecodeStr ? parseTimecode(data.timecodeStr) : null);
      });

      // Recording resumed — data.startTime in seconds
      window.electronAPI.obs.onResumed(data => {
        setState('recording');
        startTimer(timerBase); // resume from where we paused
      });

      // Recording stopped
      window.electronAPI.obs.onStopped(() => {
        setState('stopped');
        stopTimer();
        timerEl.textContent = '00:00:00';
      });

      // Ghost marks updated (color change, pause/resume cycle)
      if (window.electronAPI.obs.onGhostMarksUpdated) {
        window.electronAPI.obs.onGhostMarksUpdated(() => {
          refreshGhostMarks();
        });
      }
    }

    // ── Sync state when window becomes visible ───────────────────────────────
    if (window.electronAPI && window.electronAPI.obs && window.electronAPI.obs.onWindowVisibility) {
      window.electronAPI.obs.onWindowVisibility((visible) => {
        if (!visible) {
          // Pause the ticking interval while hidden — state is preserved in timerBase
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
        } else {
          // Re-fetch current status so missed events and timer are up to date
          window.electronAPI.obs.getStatus().then(status => {
            applyStatus(status);
          }).catch(() => setState('disconnected'));
        }
      });
    }

    // ── Button wiring ────────────────────────────────────────────────────────
    closeBtn.addEventListener('click', () => {
      if (window.electronAPI && window.electronAPI.obs) {
        window.electronAPI.obs.hideStatusWindow();
      }
    });

    btnColorPrev.addEventListener('click', () => cycleColor('prev'));
    btnColorNext.addEventListener('click', () => cycleColor('next'));
    btnCreatePrev.addEventListener('click', () => createMarkFromGhost('prev'));
    btnCreateNext.addEventListener('click', () => createMarkFromGhost('next'));
    btnFetchOcr.addEventListener('click', () => fetchClipboardOCR());
    btnAssignOcrPrev.addEventListener('click', () => assignOcrTo('prev'));
    btnAssignOcrNext.addEventListener('click', () => assignOcrTo('next'));
  </script>
</body>
</html>
