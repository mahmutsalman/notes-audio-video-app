<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- frame-src covers the in-app HTML/PDF viewer, which frames imported documents
         over the media:// protocol. Without it frame-src falls back to default-src
         'self' and the viewer's iframe is blocked. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' blob: data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; media-src 'self' file: blob: data:; img-src 'self' file: data: blob:; font-src * data: blob:; frame-src 'self' media: blob: data:;">
    <title>Notes With Audio & Video</title>
  </head>
  <body class="bg-white dark:bg-dark-bg text-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
